layout_version: 1

project:
  name: "artifacts-os"
  created: "2026-04-20"

views:
  # ===== TASK views =====

  # Lifecycle slices
  active:
    columns: id,name,assignee,status
    filters: { kind: task, status: in-progress }
    sort: -started

  ready:
    columns: id,name,assignee,created:date
    filters: { kind: task, status: ready }
    sort: created

  review:
    columns: id,name,assignee,owner
    filters: { kind: task, status: review }
    sort: -created

  backlog:
    columns: id,name,assignee,type
    filters: { kind: task, status: backlog }
    sort: created

  done:
    columns: id,name,assignee,completed:date
    filters: { kind: task, status: done }
    sort: -completed

  rejected:
    columns: id,name,assignee,owner
    filters: { kind: task, status: rejected }
    sort: -created

  # Per-assignee task queues (one per active agent)
  developer-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: developer }
    sort: status

  author-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: author }
    sort: status

  architect-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: architect }
    sort: status

  technical-writer-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: technical-writer }
    sort: status

  # Per-type task slices
  features:
    columns: id,name,status,assignee
    filters: { kind: task, type: feature }
    sort: -created

  implementations:
    columns: id,name,status,assignee
    filters: { kind: task, type: implementation }
    sort: -created

  task-specs:
    columns: id,name,status,assignee
    filters: { kind: task, type: spec }
    sort: -created

  task-docs:
    columns: id,name,status,assignee
    filters: { kind: task, type: documentation }
    sort: -created

  # ===== SPEC views =====

  spec:
    columns: id,name,status,created:date
    filters: { kind: spec }
    sort: -created

  specs-draft:
    columns: id,name,agent,created:date
    filters: { kind: spec, status: draft }
    sort: -created

  specs-approved:
    columns: id,name,agent,created:date
    filters: { kind: spec, status: approved }
    sort: -created

  # ===== RESEARCH views =====

  research:
    columns: id,name,status,created:date
    filters: { kind: research }
    sort: -created

  # ===== NOTE views =====

  note:
    columns: id,name,type,created:date
    filters: { kind: note }
    sort: -created

  note-planning:
    columns: id,name,created:date
    filters: { kind: note, type: planning }
    sort: -created

  # ===== AGENT views =====

  agents:
    columns: name,description
    filters: { kind: agent }
    sort: name

  # ===== Cross-kind utility =====

  recent:
    columns: id,kind,name,status,created:date
    sort: -created

default_views:
  task: ready
  spec: spec
  research: research
  agent: agents
  note: note

cli:
  defaults:
    show:
      editor: true
    create:
      kind: note   # `artifacts create "..."` now creates a note by default
  aliases:
    ls: list
    sh: show
    new: create
    st: status
    vf: verify
    va: validate
    k: kinds
    v: views
