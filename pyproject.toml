[project]
name = "artifacts-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
views = ["rich>=13"]
log   = []
cli   = ["rich>=13"]
tui   = ["rich>=13", "textual>=0.50"]
ai    = []
dev   = [
    "pytest>=8",
    "rich>=13",
    "textual>=0.50",
]
all   = [
    "rich>=13",
    "textual>=0.50",
]

[project.scripts]
artifacts = "artifacts_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifacts_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
