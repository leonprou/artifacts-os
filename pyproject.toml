[project]
name = "artifacts-os"
version = "0.3.0"
description = "Python library and CLI for storing, discovering, and managing structured markdown artifacts (tasks, specs, agents, research) in a vault directory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leon Prouger", email = "leonprou@gmail.com" },
]
keywords = ["artifacts", "markdown", "vault", "cli", "registry", "openstation", "frontmatter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "python-frontmatter>=1.1",
    "jsonschema>=4.23",
    "rich>=13",
]

[project.urls]
Repository = "https://github.com/leonprou/artifacts-os"
Issues = "https://github.com/leonprou/artifacts-os/issues"

[project.optional-dependencies]
views = []
log   = []
cli   = []
tui   = ["textual>=0.50"]
ai    = []
dev   = [
    "pytest>=8",
    "textual>=0.50",
]
all   = [
    "textual>=0.50",
]

[project.scripts]
artifacts = "artifacts_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifacts_os"]
artifacts = [
    "src/artifacts_os/templates/settings/*.yaml",
    "src/artifacts_os/templates/kinds/*/kind.json",
    "src/artifacts_os/templates/kinds/*/ARTIFACT.md",
    "src/artifacts_os/templates/agents/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
