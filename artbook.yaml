# artbook.yaml — artifacts-os as its own artbook distro.
#
# This file makes the artifacts-os repository itself publishable as an
# artbook distro (Layout B from spec s0029 §3.1 — "project repo doubling
# as its own distro"). Consumers point `artbook.distro_url` at this
# repo's git remote; `artifacts book pull agents` pulls the agent specs
# into `artifacts/agents/` (canonical) and `.claude/agents/` (promoted
# symlinks).
#
# References:
#   - s0031-artbook-post-pull-artifact-promotion §4.3 (migration example),
#     §3 D28 (dest: canonical-only), D29 (promote: field)
#   - s0029-artbook-mvp-distribution-model §3 (schema), §3.1 Layout B, D24, D25
#   - t0155-publish-artifacts-os-as-its (original delivery)
#   - t0175-migrate-artbook-yaml-to-promote (this migration)
#
# Notes:
#   - `dest:` is omitted for `agents` — D37 default resolves to
#     `artifacts/agents/` (canonical mirror of src basename).
#   - For `commands` and `skills` the src basename differs from the
#     desired canonical path, so `dest:` is set explicitly.
#   - `promote:` declares the tool-shaped consumer location. The
#     promotion engine creates relative symlinks from the promote target
#     back to each canonical file under `artifacts/`.
#   - `kinds` has no `promote:` — kind definitions are canonical-only.

version: 1

distro:
  name: artifacts-os
  description: Default agents shipped by artifacts-os for consumers of the library.

books:
  - name: agents
    src: artifacts/agents/
    promote: .claude/agents/
    description: Default agent specs (architect, developer, researcher, etc.).

  - name: commands
    src: src/artifacts_os/ai/claude/commands/
    dest: artifacts/commands/
    promote: .claude/commands/
    description: Slash commands for artifacts CLI (artifacts.create, artifacts.list, artifacts.show).

  # Tier 2 — skills (D26 recurse mode: folder-of-folders).
  # Each direct subdirectory of `src/` is a skill unit; the walker descends
  # the full subtree and ships it intact to `dest/<unit>/...`.
  # Adding a new skill = drop a new folder, no manifest churn.
  # See s0029 §3.2, §7.3, D26 and n0014 §Phase 2.
  - name: skills
    src: src/artifacts_os/ai/claude/skills/
    dest: artifacts/skills/
    promote: .claude/skills/
    description: Skills that teach Claude how to use artifacts-os.
    recurse: true

  # Tier 3 — kinds (vault structure, not .claude/).
  # D26 recurse walker picks up both ARTIFACT.md and kind.json per unit —
  # no file-type override needed (recurse mode is not *.md-only).
  # No promote: — kinds are canonical-only.
  - name: kinds
    src: artifacts/kinds/
    description: Standard artifact kinds (task, note, spec, research, agent).
    recurse: true

  # Tier 4 — hook registry (kind: hook book, s0032 §8).
  # Consumers run `artifacts book pull os-hooks` to land bundle dirs under
  # artifacts/hooks/; then `artifacts hooks promote <slug>` to activate.
  # promote: is forbidden for kind: hook books (D117); recurse: auto-set (D118).
  - name: os-hooks
    src: artifacts/hooks/
    kind: hook
    description: artifacts-os lifecycle hooks (auto-commit, auto-verify, …).
