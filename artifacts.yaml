layout_version: 1

default_layouts:
  task:
    layout: tree
    parent_field: parent

project:
  name: "artifacts-os"
  created: "2026-04-20"

views:
  # ===== TASK views =====

  # All tasks (no status filter) — default for `art ls --kind task`
  all:
    columns: id,name,status,assignee,owner
    filters: { kind: task }
    sort: id

  # All active (in-flight) work — multi-value status filter (s0023).
  # Replaces the per-status `ready` / `in-progress` / `review` /
  # `verified` views that were redundant with this single OR clause.
  active:
    columns: id,name,status,assignee
    filters: { kind: task, status: [ready, in-progress, review, verified] }
    layout: tree
    parent_field: parent
    prune: subtree
    sort: id

  # Terminal/lifecycle slices retained — each has a unique role.
  backlog:
    columns: id,name,assignee,type
    filters: { kind: task, status: backlog }
    sort: created

  done:
    columns: id,name,assignee,completed:date
    filters: { kind: task, status: done }
    sort: -completed

  rejected:
    columns: id,name,assignee,owner
    filters: { kind: task, status: rejected }
    sort: -created

  # Per-assignee task queues (one per active agent)
  developer-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: developer }
    sort: status

  author-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: author }
    sort: status

  architect-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: architect }
    sort: status

  technical-writer-queue:
    columns: id,name,status,created:date
    filters: { kind: task, assignee: technical-writer }
    sort: status

  # Per-type task slices
  features:
    columns: id,name,status,assignee
    filters: { kind: task, type: feature }
    sort: -created

  implementations:
    columns: id,name,status,assignee
    filters: { kind: task, type: implementation }
    sort: -created

  task-specs:
    columns: id,name,status,assignee
    filters: { kind: task, type: spec }
    sort: -created

  task-docs:
    columns: id,name,status,assignee
    filters: { kind: task, type: documentation }
    sort: -created

  # ===== SPEC views =====

  specs:
    columns: id,name,status,created:date
    filters: { kind: spec }
    sort: -created

  specs-draft:
    columns: id,name,agent,created:date
    filters: { kind: spec, status: draft }
    sort: -created

  specs-approved:
    columns: id,name,agent,created:date
    filters: { kind: spec, status: approved }
    sort: -created

  # ===== RESEARCH views =====

  research:
    columns: id,name,status,created:date
    filters: { kind: research }
    sort: -created

  # ===== NOTE views =====

  notes:
    columns: id,name,type,created:date
    filters: { kind: note }
    sort: id

  note-planning:
    columns: id,name,created:date
    filters: { kind: note, type: planning }
    sort: -created

  # ===== AGENT views =====

  agents:
    columns: name,alias,description
    filters: { kind: agent }
    sort: name

  # ===== Cross-kind utility =====

  recent:
    columns: id,kind,name,status,created:date
    sort: -created

default_views:
  task: active
  spec: specs
  research: research
  agent: agents
  note: notes

cli:
  defaults:
    create:
      kind: note   # `artifacts create "..."` now creates a note by default
